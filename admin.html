<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PGW Admin 0.5.0.v1</title><style>body{margin:0;background:#090e16;color:#f4f7fb;font-family:system-ui}main{max-width:1200px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#121a29;border:1px solid #2c3950;border-radius:18px;padding:16px;margin:12px 0}.card b{font-size:28px}.btn{display:inline-block;margin:4px;padding:10px 13px;border:1px solid #40506e;border-radius:12px;color:inherit;text-decoration:none;background:#182439}.ok{color:#56d88d}.bad{color:#ff6c72}.muted{color:#9da9ba}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #2c3950;text-align:left}code{background:#192338;padding:2px 5px;border-radius:5px}</style></head><body><main><h1>PGW Admin - 0.5.0.v1</h1><p class="muted">Global Service Passport, audyt v110 i READY-only patch.</p><div id="cards" class="grid"></div><section class="card"><a class="btn" href="./">Formularz</a><a class="btn" href="quality-center.html">Quality Center</a><a class="btn" href="rebuild-studio.html">Rebuild Studio</a><a class="btn" href="gap-register.html">Gap Register</a><a class="btn" href="healthcheck.html">Healthcheck</a></section><section class="card"><h2>Kontrola plików</h2><table><tbody id="rows"></tbody></table></section><script>const files=['RELEASE.json','index.html','app.js','config.js','client-suite.js','client-suite.css','sw-v050-v1.js','data/i18n-v050-v1.json','data/client-capabilities-v050-v1.json','data/drive-drawings-patch-v050v1.json','data/audit-run-v050v1.json','data/photo-acquisition-queue-v050v1.json','data/quality-center-v110.json','data/rebuild-work-orders-v110.json'];Promise.all(files.map(async f=>{try{const r=await fetch(f+'?v='+Date.now(),{cache:'no-store'}),t=await r.text();let j=null;try{j=JSON.parse(t)}catch{};return{f,ok:r.ok,size:t.length,n:Array.isArray(j?.items)?j.items.length:null}}catch(e){return{f,ok:false,size:e.message}}})).then(a=>{const ok=a.filter(x=>x.ok).length;cards.innerHTML=[['Wersja','0.5.0.v1'],['Pliki OK',ok+'/'+a.length],['Języki','6'],['Public READY','4'],['Audyt','3 modele']].map(([x,y])=>`<div class="card"><span class="muted">${x}</span><br><b>${y}</b></div>`).join('');rows.innerHTML=a.map(x=>`<tr><td><code>${x.f}</code></td><td class="${x.ok?'ok':'bad'}">${x.ok?'OK':'BŁĄD'}</td><td>${x.size}${x.n!=null?' / '+x.n+' rekordów':''}</td></tr>`).join('')})</script></main></body></html>
