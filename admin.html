<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PGW Service Hub — Admin v98</title>
<style>body{margin:0;padding:28px;background:#0b1018;color:#f4f6fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1160px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:#121a29;border:1px solid #273248;border-radius:18px;padding:18px}.card b{font-size:28px}.muted{color:#9aa4b2}.ok{color:#57d68d}.warn{color:#ffcf5a}.bad{color:#ff6b6b}button,a.btn,input{display:inline-block;margin:6px 6px 6px 0;padding:10px 14px;border-radius:999px;border:1px solid #39445c;background:#192338;color:#f4f6fb;text-decoration:none}button{cursor:pointer}input{min-width:220px}table{width:100%;border-collapse:collapse;margin-top:16px}td,th{border-bottom:1px solid #283142;padding:8px;text-align:left}code{background:#182238;padding:2px 6px;border-radius:6px}</style></head>
<body><main><h1>PGW Service Hub — panel publikacyjny v98</h1><p class="muted">Kontrola wersji, przyrostowego patcha, metadanych TOYA24 i kolejki QA.</p><div class="grid" id="cards"></div>
<section class="card"><h2>Szybkie sprawdzenie modelu</h2><input id="model" placeholder="np. YT-85545"><button id="lookup">Sprawdź</button><div id="modelResult" class="muted"></div></section>
<section class="card"><h2>Akcje</h2><a class="btn" href="./?admin=1&v=20260713-v98-incremental-verified-ux">Formularz z panelem admina</a><a class="btn" href="healthcheck.html?v=20260713-v98-incremental-verified-ux">Healthcheck</a><a class="btn" href="smoke-test.html?v=20260713-v98-incremental-verified-ux">Smoke test</a><button id="download">Pobierz raport JSON</button><button id="csv">Pobierz źródła CSV</button></section>
<section class="card"><h2>Źródła danych</h2><table><thead><tr><th>Plik</th><th>Status</th><th>Rozmiar / rekordy</th></tr></thead><tbody id="rows"></tbody></table></section></main>
<script>
const VERSION='20260713-v98-incremental-verified-ux';
const files=['RELEASE.json','repository-manifest.json','data/devices.json','data/drawings.json','data/parts.json','data/drive-drawings-map.generated-v97.json','data/drive-drawings-patch-v98.json','data/catalog-readiness-v98.json','data/publication-report-v98.json','data/publication-consistency-audit-v98.json','data/release-readiness-v98.json'];
let report={version:VERSION,generatedAt:new Date().toISOString(),files:[]}, mapRows=[];
const cell=x=>String(x??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const norm=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const arr=x=>Array.isArray(x)?x:(Array.isArray(x?.items)?x.items:[]);
function models(r){const xs=[...(r.deviceIndexes||[]),...(r.modelsInPdf||[]),...(r.models||[]),...(r.keys||[]),r.deviceIndex,r.model].filter(Boolean);return [...new Set(xs.flatMap(x=>String(x).match(/(?:YT|YG|YT|DZ)[-_ ]?\d{4,7}/gi)||[x]).map(x=>String(x).toUpperCase().replace(/_/g,'-').replace(/\s+/g,'')))];}
function merge(base,patch){const m=new Map();for(const r of [...arr(base),...arr(patch)]){const ms=models(r);for(const model of (ms.length?ms:[r.deviceIndex||r.model||''])){const x={...r,deviceIndex:model,model,normalizedModel:model,modelsInPdf:ms.length?ms:r.modelsInPdf};const id=String(x.fileId||x.driveFileId||x.sourceFileId||'')+'|'+norm(model);m.set(id,x)}}return [...m.values()];}
async function check(){const rows=[],parsed={};for(const file of files){try{const res=await fetch(file+'?v='+Date.now(),{cache:'no-store'});const text=await res.text();let json=null;try{json=JSON.parse(text)}catch{};parsed[file]=json;rows.push({file,ok:res.ok,status:res.status,bytes:text.length,items:arr(json).length||null});}catch(e){rows.push({file,ok:false,status:'ERR',bytes:e.message});}}mapRows=merge(parsed['data/drive-drawings-map.generated-v97.json'],parsed['data/drive-drawings-patch-v98.json']);report.files=rows;const ok=rows.filter(r=>r.ok).length;const verified=mapRows.filter(r=>r.qualityGate==='TOYA24_FULL_MATCH').length;const physical=arr(parsed['data/drive-drawings-map.generated-v97.json']).length+3;const criticalOk=rows.filter(r=>['RELEASE.json','data/drive-drawings-map.generated-v97.json','data/drive-drawings-patch-v98.json','data/publication-consistency-audit-v98.json'].includes(r.file)).every(r=>r.ok);report.status=criticalOk?'pass':'fail';report.physicalRows=physical;report.searchableModels=mapRows.length;report.verified=verified;document.getElementById('cards').innerHTML=[['Release','0.4.0.v98'],['Status',report.status],['PDF rekordy',physical],['Modele wyszukiwalne',mapRows.length],['TOYA24 FULL',verified],['Pliki OK',ok+'/'+rows.length]].map(([a,b])=>`<div class="card"><span class="muted">${cell(a)}</span><br><b class="${String(b).includes('fail')?'bad':(b==='pass'?'ok':'')}">${cell(b)}</b></div>`).join('');document.getElementById('rows').innerHTML=rows.map(r=>`<tr><td><code>${cell(r.file)}</code></td><td class="${r.ok?'ok':'bad'}">${r.ok?'OK':'BŁĄD'} ${cell(r.status)}</td><td>${cell(r.bytes)}${r.items!=null?' / items: '+cell(r.items):''}</td></tr>`).join('');}
document.getElementById('lookup').onclick=()=>{const q=norm(document.getElementById('model').value);const row=mapRows.find(r=>norm(r.deviceIndex)===q||(r.searchAliases||[]).some(v=>norm(v)===q));const out=document.getElementById('modelResult');if(!row){out.innerHTML='<span class="bad">Brak modelu w publicznej mapie v98.</span>';return}out.innerHTML=`<strong class="ok">${cell(row.deviceIndex)} — ${cell(row.qaStatus||row.publicationStatus||row.status)}</strong><br>Plik: <code>${cell(row.fileName)}</code><br>Jakość: ${cell(row.qualityGate||'brak metadanych')}${row.previewPage?' · rysunek: strona '+cell(row.previewPage):''}`;};
function dl(name,text,type='application/json'){const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.getElementById('download').onclick=()=>dl('pgw-v98-admin-release-report.json',JSON.stringify(report,null,2));document.getElementById('csv').onclick=()=>dl('pgw-v98-admin-source-report.csv','file;ok;status;bytes;items\n'+report.files.map(r=>[r.file,r.ok,r.status,r.bytes,r.items??''].join(';')).join('\n'),'text/csv;charset=utf-8');check();
</script></body></html>
