<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PGW Service Hub — v97 Admin</title>
<style>body{margin:0;padding:28px;background:#0b1018;color:#f4f6fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1160px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:#121a29;border:1px solid #273248;border-radius:18px;padding:18px}.card b{font-size:25px}.muted{color:#9aa4b2}.ok{color:#57d68d}.warn{color:#ffcf5a}.bad{color:#ff6b6b}button,a.btn{display:inline-block;margin:6px 6px 6px 0;padding:10px 14px;border-radius:999px;border:1px solid #39445c;background:#192338;color:#f4f6fb;text-decoration:none;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:16px}td,th{border-bottom:1px solid #283142;padding:8px;text-align:left}code{background:#182238;padding:2px 6px;border-radius:6px}</style></head>
<body><main><h1>PGW Service Hub — panel publikacyjny v97</h1><p class="muted">Kontrola release candidate. Publiczna gotowość PDF i kompletność danych SAP/PL/EN są raportowane oddzielnie.</p><div class="grid" id="cards"></div><section class="card"><h2>Akcje</h2><a class="btn" href="./?admin=1&v=20260712-v97-foundation-for-v05">Formularz z panelem</a><a class="btn" href="healthcheck.html?v=20260712-v97-foundation-for-v05">Healthcheck</a><a class="btn" href="smoke-test.html?v=20260712-v97-foundation-for-v05">Smoke test</a><button id="download">Pobierz raport JSON</button><button id="csv">Pobierz źródła CSV</button></section><section class="card"><h2>Źródła danych</h2><table><thead><tr><th>Plik</th><th>Status</th><th>Rozmiar / rekordy</th></tr></thead><tbody id="rows"></tbody></table></section></main>
<script>
const VERSION='20260712-v97-foundation-for-v05';
const files=['RELEASE.json','repository-manifest.json','data/release-info.json','data/release-checks.json','data/devices.json','data/drawings.json','data/parts.json','data/drive-drawings-map.generated-v97.json','data/publication-report-v97.json','data/publication-consistency-audit-v97.json','data/catalog-readiness-v97.json','data/release-readiness-v97.json','data/pdf-rewrite-queue-v97.json','reports/source-coverage-v97.json'];
let report={version:VERSION,generatedAt:new Date().toISOString(),files:[]};const esc=x=>String(x??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
async function check(){const rows=[];for(const file of files){try{const res=await fetch(file+'?v='+Date.now(),{cache:'no-store'});const text=await res.text();let parsed=null;try{parsed=JSON.parse(text)}catch{};const item={file,ok:res.ok,status:res.status,bytes:text.length,items:Array.isArray(parsed)?parsed.length:(Array.isArray(parsed?.items)?parsed.items.length:null),parsed};rows.push(item);report.files.push({...item,parsed:undefined});}catch(e){const item={file,ok:false,status:'ERR',bytes:e.message};rows.push(item);report.files.push(item);}}
 const by=f=>rows.find(r=>r.file===f)?.parsed;const release=by('RELEASE.json'),map=by('data/drive-drawings-map.generated-v97.json'),catalog=by('data/catalog-readiness-v97.json'),queue=by('data/pdf-rewrite-queue-v97.json');const mapRows=Array.isArray(map?.items)?map.items.length:0;const criticalOk=release?.publicMap==='data/drive-drawings-map.generated-v97.json'&&mapRows>=2177&&rows.filter(r=>['data/devices.json','data/drawings.json','data/parts.json','data/drive-drawings-map.generated-v97.json'].includes(r.file)).every(r=>r.ok);report.status=criticalOk?'pass':'fail';report.contracts=catalog?.releaseContract;report.manualQueue=(queue?.items||[]).map(x=>x.model);
 const cards=[['Release','0.4.0.v97',''],['Status',report.status,report.status==='pass'?'ok':'bad'],['Mapa PDF',mapRows,mapRows>=2177?'ok':'bad'],['Rysunki',catalog?.releaseContract?.publicDrawingCatalog||'brak','warn'],['Pełne TOYA24',catalog?.releaseContract?.fullTOYA24Catalog||'brak','warn'],['Części zmapowane',(catalog?.deviceCatalog?.devicesWithMappedParts||0)+' / '+(catalog?.deviceCatalog?.devices||0),'warn'],['MANUAL',(queue?.items||[]).map(x=>x.model).join(', ')||'0',(queue?.items||[]).length?'warn':'ok']];document.getElementById('cards').innerHTML=cards.map(([a,b,c])=>`<div class="card"><span class="muted">${esc(a)}</span><br><b class="${c}">${esc(b)}</b></div>`).join('');document.getElementById('rows').innerHTML=rows.map(r=>`<tr><td><code>${esc(r.file)}</code></td><td class="${r.ok?'ok':'bad'}">${r.ok?'OK':'BŁĄD'} ${esc(r.status)}</td><td>${esc(r.bytes)}${r.items!=null?' / rekordy: '+esc(r.items):''}</td></tr>`).join('');}
function dl(name,text,type='application/json'){const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.getElementById('download').onclick=()=>dl('pgw-v97-admin-release-report.json',JSON.stringify(report,null,2));document.getElementById('csv').onclick=()=>dl('pgw-v97-admin-source-report.csv','file;ok;status;bytes;items\n'+report.files.map(r=>[r.file,r.ok,r.status,r.bytes,r.items??''].join(';')).join('\n'),'text/csv;charset=utf-8');check();
</script></body></html>
