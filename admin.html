<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PGW Service Hub — Admin</title>
<style>body{margin:0;padding:28px;background:#0b1018;color:#f4f6fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1120px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:#121a29;border:1px solid #273248;border-radius:18px;padding:18px}.card b{font-size:28px}.muted{color:#9aa4b2}.ok{color:#57d68d}.warn{color:#ffcf5a}.bad{color:#ff6b6b}button,a.btn{display:inline-block;margin:6px 6px 6px 0;padding:10px 14px;border-radius:999px;border:1px solid #39445c;background:#192338;color:#f4f6fb;text-decoration:none;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:16px}td,th{border-bottom:1px solid #283142;padding:8px;text-align:left}code{background:#182238;padding:2px 6px;border-radius:6px}</style>
</head><body><main><h1>PGW Service Hub — panel publikacyjny</h1><p class="muted">Standalone kontrola release. Klient nie powinien dostawać linku do tego pliku.</p><div class="grid" id="cards"></div><section class="card"><h2>Akcje</h2><a class="btn" href="./?admin=1&v=20260710-v73-stable-control">Otwórz formularz z panelem admina</a><a class="btn" href="healthcheck.html?v=20260710-v73-stable-control">Healthcheck</a><button id="download">Pobierz raport JSON</button><button id="csv">Pobierz źródła CSV</button></section><section class="card"><h2>Źródła danych</h2><table><thead><tr><th>Plik</th><th>Status</th><th>Rozmiar</th></tr></thead><tbody id="rows"></tbody></table></section></main>
<script>
const VERSION='20260710-v73-stable-control';
const files=['RELEASE.json','repository-manifest.json','data/release-info.json','data/deployment-state.json','data/devices.json','data/drawings.json','data/parts.json','data/drive-drawings-map.full.json','data/drive-drawings-map.converted.json','data/pdf-quality-report.json','data/pdf-orphans.json','data/pdf-override-candidates.json'];
let report={version:VERSION,generatedAt:new Date().toISOString(),files:[]};
function cell(x){return String(x??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
async function check(){
  const rows=[];
  for (const file of files){
    try{const res=await fetch(file+'?v='+Date.now(),{cache:'no-store'}); const text=await res.text(); let parsed=null; try{parsed=JSON.parse(text)}catch(e){}; const item={file,ok:res.ok,status:res.status,bytes:text.length,items:Array.isArray(parsed)?parsed.length:(parsed&&Array.isArray(parsed.items)?parsed.items.length:null)}; report.files.push(item); rows.push(item);}
    catch(e){rows.push({file,ok:false,status:'ERR',bytes:e.message}); report.files.push(rows[rows.length-1]);}
  }
  const ok=rows.filter(r=>r.ok).length;
  const criticalOk=rows.filter(r=>['data/devices.json','data/drawings.json','data/parts.json','data/drive-drawings-map.full.json'].includes(r.file)).every(r=>r.ok);
  report.status=criticalOk?'pass':'fail';
  document.getElementById('cards').innerHTML=[['Release',VERSION],['Status',report.status],['Pliki OK',ok+'/'+rows.length],['Krytyczne źródła',criticalOk?'OK':'BŁĄD']].map(([a,b])=>`<div class="card"><span class="muted">${cell(a)}</span><br><b class="${String(b).includes('BŁ')||b==='fail'?'bad':(b==='OK'||b==='pass'?'ok':'')}">${cell(b)}</b></div>`).join('');
  document.getElementById('rows').innerHTML=rows.map(r=>`<tr><td><code>${cell(r.file)}</code></td><td class="${r.ok?'ok':'bad'}">${r.ok?'OK':'BŁĄD'} ${cell(r.status)}</td><td>${cell(r.bytes)}${r.items!=null?' / items: '+cell(r.items):''}</td></tr>`).join('');
}
function dl(name,text,type='application/json'){const blob=new Blob([text],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.getElementById('download').onclick=()=>dl('pgw-admin-release-report.json',JSON.stringify(report,null,2));
document.getElementById('csv').onclick=()=>dl('pgw-admin-source-report.csv','file;ok;status;bytes;items
'+report.files.map(r=>[r.file,r.ok,r.status,r.bytes,r.items??''].join(';')).join('
'),'text/csv;charset=utf-8');
check();
</script></body></html>
