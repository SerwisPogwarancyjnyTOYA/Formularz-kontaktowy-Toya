<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PGW Service Hub — v97 Smoke test</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1018;color:#f4f6fb;margin:0;padding:32px}main{max-width:1060px;margin:auto}pre{white-space:pre-wrap;background:#111a2b;border:1px solid #2a354b;border-radius:16px;padding:18px}.ok{color:#57d68d}.warn{color:#ffcf5a}.bad{color:#ff6b6b}a{color:#fff}</style></head>
<body><main><h1>Smoke test — 20260712-v97-foundation-for-v05</h1><p>Szybki test danych, wyszukiwania i odzyskanych modeli bez przechodzenia formularza.</p><p><a href="./?admin=1&v=20260712-v97-foundation-for-v05">Formularz admin</a> · <a href="admin.html?v=20260712-v97-foundation-for-v05">Admin</a> · <a href="healthcheck.html?v=20260712-v97-foundation-for-v05">Healthcheck</a></p><div id="summary">Start…</div><pre id="out"></pre></main>
<script>
const VERSION='20260712-v97-foundation-for-v05';const files={devices:'data/devices.json',drawings:'data/drawings.json',parts:'data/parts.json',drive:'data/drive-drawings-map.generated-v97.json',release:'RELEASE.json',catalog:'data/catalog-readiness-v97.json'};const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[-_\s]+/g,'');async function json(path){const res=await fetch(path+'?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error(path+' '+res.status);return res.json();}
(async()=>{const report={version:VERSION,generatedAt:new Date().toISOString(),checks:[]};try{const [devices,drawings,parts,drive,release,catalog]=await Promise.all(Object.values(files).map(json));const arr=x=>Array.isArray(x)?x:(Array.isArray(x?.items)?x.items:[]);const D=arr(devices),R=arr(drawings),P=arr(parts),M=arr(drive);report.counts={devices:D.length,drawings:R.length,parts:P.length,pdfManifestRows:M.length};for(const [name,count,min] of [['devices',D.length,1400],['drawings',R.length,1400],['parts',P.length,2600],['pdfManifestRows',M.length,2177]])report.checks.push({name,ok:count>=min,count,min});report.checks.push({name:'strictV97Map',ok:release.publicMap==='data/drive-drawings-map.generated-v97.json',value:release.publicMap});const samples=['YT-82806','YT82806','82200','79004','09903','YT-8277905','YT-8277915','YT-8277935','YT-8281185'];report.search=samples.map(q=>{const nq=norm(q);const hits=D.filter(d=>norm([d.deviceIndex,d.index,d.model,d.name,d.title].filter(Boolean).join(' ')).includes(nq)).slice(0,5);const mapHits=M.filter(r=>norm([r.model,...(r.searchAliases||[]),r.fileName].join(' ')).includes(nq)).slice(0,5);return{query:q,deviceHits:hits.map(d=>d.deviceIndex||d.index||d.model),mapHits:mapHits.map(r=>r.model)};});for(const model of ['YT-8277905','YT-8277915','YT-8277935'])report.checks.push({name:'recovered:'+model,ok:M.some(r=>r.model===model&&r.publicationStatus==='PUBLIC_READY')});report.contracts=catalog.releaseContract;report.status=report.checks.every(c=>c.ok)?'pass':'fail';}catch(e){report.status='fail';report.error=e.message;}document.getElementById('summary').innerHTML='<strong class="'+(report.status==='pass'?'ok':'bad')+'">'+report.status.toUpperCase()+'</strong>';document.getElementById('out').textContent=JSON.stringify(report,null,2);})();
</script></body></html>
