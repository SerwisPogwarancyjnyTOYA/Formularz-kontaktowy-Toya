<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PGW Service Hub — v98 Smoke test</title><style>body{font-family:system-ui;background:#0b1018;color:#f4f6fb;padding:30px}main{max-width:1000px;margin:auto}.ok{color:#57d68d}.bad{color:#ff6b6b}li{margin:8px 0}</style></head><body><main><h1>Smoke test — 0.4.0.v98</h1><p>Sprawdza bazę v97, przyrostowy patch v98, odzyskane modele, alias i metadane TOYA24.</p><ul id="out"></ul><script>
const required=["YT-85525","YT-85528","YT-85532","YT-85533","YT-85537","YT-85545","YT-85570","YT-85580","YT-85590","YT-85591","YT-85592","YT-85600","YT-8277905","YT-8277915","YT-8277935"];const norm=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');const arr=x=>Array.isArray(x)?x:(x?.items||[]);Promise.all(['data/drive-drawings-map.generated-v97.json','data/drive-drawings-patch-v98.json'].map(x=>fetch(x+'?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()))).then(([base,patch])=>{const rows=[...arr(base),...arr(patch)];const out=[];for(const model of required){const candidates=rows.filter(r=>norm(r.deviceIndex||r.model)===norm(model));const row=candidates[candidates.length-1];out.push({name:model,ok:!!row&&row.qualityGate==='TOYA24_FULL_MATCH'&&Number(row.previewPage)>0})}const alias=arr(patch).find(r=>norm(r.deviceIndex||r.model)===norm('YT-828118'));out.push({name:'alias YT-8281185',ok:!!alias&&(alias.modelsInPdf||[]).includes('YT-8281185')});out.push({name:'patch size 16',ok:arr(patch).length===16});document.getElementById('out').innerHTML=out.map(x=>`<li class="${x.ok?'ok':'bad'}">${x.ok?'PASS':'FAIL'} — ${x.name}</li>`).join('')}).catch(e=>document.getElementById('out').innerHTML='<li class="bad">'+e.message+'</li>');
</script></main></body></html>
