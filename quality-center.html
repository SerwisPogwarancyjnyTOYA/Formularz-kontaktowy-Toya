<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PGW Quality Center v110</title>
<style>:root{color-scheme:dark;--bg:#080d15;--panel:#121a28;--line:#29364c;--text:#f5f7fb;--muted:#9eabbc;--ok:#54d68a;--warn:#ffca55;--bad:#ff6c72;--blue:#64adff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1550px;margin:auto;padding:24px}.top,.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn,button,input,select{background:#182338;color:var(--text);border:1px solid #3a4964;border-radius:11px;padding:10px 12px;text-decoration:none}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px}.kpi b{font-size:30px}.muted{color:var(--muted)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.bar{height:8px;background:#26334a;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{position:sticky;top:0;background:#101827}.scroll{overflow:auto;max-height:68vh}.badge{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:3px 7px;font-weight:700;font-size:11px}.READY{color:var(--ok)}.REBUILD{color:var(--warn)}.MANUAL_REQUIRED,.ARCHIVE_ONLY{color:var(--bad)}.nowrap{white-space:nowrap}.small{font-size:12px}.selected{outline:2px solid var(--blue)}@media print{.no-print{display:none!important}.scroll{max-height:none;overflow:visible}body,.card,th{background:#fff;color:#000}}</style></head><body><main>
<div class="top"><div><h1>PGW Quality Operations Center v110</h1><p class="muted">33 modele, zlecenia naprawcze, rejestr luk TOYA24 i twardy gate publikacyjny.</p></div><nav class="nav no-print"><a class="btn" href="admin.html">Admin</a><a class="btn" href="rebuild-studio.html">Rebuild Studio</a><a class="btn" href="gap-register.html">TOYA24 Gap Register</a><a class="btn" href="healthcheck.html">Healthcheck</a></nav></div>
<div id="kpis" class="grid"></div><section class="card"><div id="gate"></div></section>
<section class="card no-print"><div class="toolbar"><div><input id="q" placeholder="model, nazwa, blokada"><select id="status"><option value="">Wszystkie statusy</option><option>READY</option><option>REBUILD</option><option>MANUAL_REQUIRED</option><option>ARCHIVE_ONLY</option></select><select id="action"><option value="">Wszystkie działania</option></select></div><div><button id="selectedExport">Eksport zaznaczonych</button><button id="json">JSON</button><button id="csv">CSV</button></div></div></section>
<section class="card scroll"><table><thead><tr><th></th><th>Priorytet</th><th>Model</th><th>Status</th><th>Gotowość</th><th>Braki</th><th>Działanie</th><th>Źródło</th></tr></thead><tbody id="rows"></tbody></table></section>
<script>const U='data/quality-center-v110.json';let D,selected=new Set();const e=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const dl=(n,t,y)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:y}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};function f(){const q=document.querySelector('#q').value.toLowerCase(),s=document.querySelector('#status').value,a=document.querySelector('#action').value;return D.items.filter(x=>(!q||[x.model,x.name,x.actionType,...x.blockers].join(' ').toLowerCase().includes(q))&&(!s||x.status===s)&&(!a||x.actionType===a))}function render(){const r=f();rows.innerHTML=r.map(x=>`<tr class="${selected.has(x.model)?'selected':''}"><td><input type="checkbox" ${selected.has(x.model)?'checked':''} onchange="toggle('${e(x.model)}')"></td><td><b>${x.priorityScore}</b><br><span class="small">${e(x.estimatedEffort)}</span></td><td><b>${e(x.model)}</b><br><span class="muted small">${e(x.name)}</span></td><td><span class="badge ${e(x.status)}">${e(x.status)}</span></td><td><div class="bar"><i style="width:${x.readinessScore}%"></i></div><span class="small">${x.readinessScore}%</span></td><td class="small">${!x.hasPhoto?'zdjęcie<br>':''}${!x.hasDrawing?'rysunek<br>':''}${!x.hasParts?'części<br>':''}${e((x.blockers||[]).join('; '))}</td><td><b>${e(x.actionType)}</b><br><span class="small">${e(x.requiredAction)}</span></td><td>${x.sourceUrl?`<a class="btn" target="_blank" href="${e(x.sourceUrl)}">Otwórz</a>`:'brak linku'}</td></tr>`).join('')}window.toggle=m=>{selected.has(m)?selected.delete(m):selected.add(m);render()};function k(){const s=D.summary;kpis.innerHTML=[['Modele',s.models],['READY',s.ready],['REBUILD',s.rebuild],['MANUAL',s.manualRequired],['ARCHIVE',s.archiveOnly],['Work orders',s.workOrders],['Fast wins',s.fastWins],['Nowe READY',s.latestReady.length]].map(([a,b])=>`<div class="card kpi"><span class="muted">${a}</span><br><b>${e(b)}</b></div>`).join('');gate.innerHTML=`<h2>Release gate: <span class="warn">OPERACYJNY PASS / PUBLICZNY HOLD</span></h2><p>Centrum i workflow są gotowe. Publiczna mapa nie zmienia się automatycznie; do publikacji trafiają wyłącznie rekordy READY.</p>`;[...new Set(D.items.map(x=>x.actionType))].sort().forEach(v=>action.insertAdjacentHTML('beforeend',`<option>${e(v)}</option>`))}fetch(U+'?v='+Date.now()).then(r=>r.json()).then(x=>{D=x;k();render()});q.oninput=render;status.onchange=render;action.onchange=render;json.onclick=()=>dl('quality-center-v110.json',JSON.stringify(D,null,2),'application/json');csv.onclick=()=>dl('quality-center-v110.csv',['model;name;status;priority;readiness;action',...D.items.map(x=>[x.model,x.name,x.status,x.priorityScore,x.readinessScore,x.actionType].map(v=>`"${String(v).replaceAll('"','""')}"`).join(';'))].join('
'),'text/csv;charset=utf-8');selectedExport.onclick=()=>dl('selected-work-package-v110.json',JSON.stringify({generatedAt:new Date().toISOString(),items:D.items.filter(x=>selected.has(x.model))},null,2),'application/json');</script></main></body></html>
