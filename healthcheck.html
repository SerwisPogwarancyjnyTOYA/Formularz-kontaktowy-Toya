<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PGW Service Hub — v98 Healthcheck</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1018;color:#f4f6fb;margin:0;padding:32px}main{max-width:1080px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:#121a29;border:1px solid #283142;border-radius:16px;padding:16px}.ok{color:#57d68d}.bad{color:#ff6b6b}.muted{color:#9aa4b2}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{border-bottom:1px solid #283142;padding:10px;text-align:left}code{background:#151c2a;padding:2px 6px;border-radius:6px}</style></head><body><main><h1>PGW Service Hub — healthcheck 0.4.0.v98</h1><p class="muted">Kontrola krytycznych plików, patcha przyrostowego i spójności publikacji.</p><div class="grid" id="cards"></div><table><thead><tr><th>Plik</th><th>Status</th><th>Rozmiar / błąd</th></tr></thead><tbody id="rows"></tbody></table><p class="muted">Admin: <code>admin.html?v=20260713-v98-incremental-verified-ux</code></p></main><script>
const files=['index.html','app.css','config.js','app.js','manifest.webmanifest','package.json','RELEASE.json','repository-manifest.json','data/devices.json','data/drawings.json','data/parts.json','data/drive-drawings-map.generated-v97.json','data/drive-drawings-patch-v98.json','data/catalog-readiness-v98.json','data/publication-report-v98.json','data/publication-consistency-audit-v98.json','data/release-readiness-v98.json','admin.html','smoke-test.html'];
const arr=x=>Array.isArray(x)?x:(Array.isArray(x?.items)?x.items:[]);
Promise.all(files.map(async file=>{try{const res=await fetch(file+'?v='+Date.now(),{cache:'no-store'});const text=await res.text();let parsed=null;try{parsed=JSON.parse(text)}catch{};return{file,ok:res.ok,status:res.status,size:text.length,parsed}}catch(e){return{file,ok:false,status:'ERR',size:e.message}}})).then(results=>{const base=results.find(r=>r.file.endsWith('generated-v97.json'))?.parsed;const patch=results.find(r=>r.file.endsWith('patch-v98.json'))?.parsed;const audit=results.find(r=>r.file.includes('consistency-audit'))?.parsed;const baseRows=arr(base),patchRows=arr(patch);const verified=patchRows.filter(r=>r.qualityGate==='TOYA24_FULL_MATCH').length;const ok=results.filter(r=>r.ok).length;const physical=baseRows.length+patchRows.filter(r=>!baseRows.some(b=>(b.fileId||'')===(r.fileId||'')&&(b.deviceIndex||b.model)===(r.deviceIndex||r.model))).length;const pass=ok===results.length&&audit?.status==='PASS'&&baseRows.length===2174&&patchRows.length===16&&physical===2177;document.getElementById('cards').innerHTML=[['Release','0.4.0.v98'],['Pliki',ok+'/'+results.length],['Baza',baseRows.length],['Patch',patchRows.length],['PDF rekordy',physical],['TOYA24 FULL',verified],['Gate',pass?'PASS':'FAIL']].map(([a,b])=>`<div class="card"><span class="muted">${a}</span><br><strong class="${b==='PASS'?'ok':(b==='FAIL'?'bad':'')}">${b}</strong></div>`).join('');document.getElementById('rows').innerHTML=results.map(r=>`<tr><td><code>${r.file}</code></td><td class="${r.ok?'ok':'bad'}">${r.ok?'OK':'BŁĄD'} ${r.status}</td><td>${r.size}</td></tr>`).join('')});
</script></body></html>
