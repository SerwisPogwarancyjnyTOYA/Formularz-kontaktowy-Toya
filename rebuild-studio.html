<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PGW Rebuild Studio v110</title><style>:root{color-scheme:dark;--bg:#090e16;--p:#121a28;--l:#2c3950;--t:#f5f7fb;--m:#9daabc;--ok:#54d68a;--w:#ffca55;--b:#ff6c72}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui}main{max-width:1500px;margin:auto;padding:24px}.top,.tools{display:flex;gap:9px;flex-wrap:wrap;justify-content:space-between}.btn,button,input,select,textarea{background:#182338;color:var(--t);border:1px solid #40506d;border-radius:10px;padding:9px 11px;text-decoration:none}.board{display:grid;grid-template-columns:repeat(3,minmax(280px,1fr));gap:12px;margin-top:18px}.lane{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:12px;min-height:300px}.ticket{border:1px solid var(--l);border-radius:13px;padding:12px;margin:9px 0;background:#0f1724;cursor:pointer}.ticket b{font-size:17px}.muted{color:var(--m)}.S{color:var(--ok)}.M{color:var(--w)}.L{color:var(--b)}dialog{width:min(900px,95vw);background:var(--p);color:var(--t);border:1px solid var(--l);border-radius:18px}dialog::backdrop{background:#000a}.check{display:block;margin:8px 0}textarea{width:100%;min-height:110px}@media(max-width:950px){.board{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div><h1>Rebuild Studio v110</h1><p class="muted">Zlecenia naprawcze z checklistą, notatkami lokalnymi i eksportem postępu.</p></div><div><a class="btn" href="quality-center.html">Quality Center</a><a class="btn" href="gap-register.html">Gap Register</a></div></div><div class="tools"><input id="q" placeholder="szukaj modelu"><select id="eff"><option value="">Każdy nakład</option><option>S</option><option>M</option><option>L</option></select><button id="exportProgress">Eksport postępu</button></div><div class="board"><section class="lane"><h2>FAST WIN / S</h2><div id="fast"></div></section><section class="lane"><h2>REBUILD / M-L</h2><div id="rebuild"></div></section><section class="lane"><h2>MANUAL / ARCHIVE</h2><div id="manual"></div></section></div><dialog id="dlg"><form method="dialog"><button style="float:right">Zamknij</button></form><div id="detail"></div></dialog><script>let W;const S=JSON.parse(localStorage.getItem('pgw-v110-progress')||'{}');const e=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function save(){localStorage.setItem('pgw-v110-progress',JSON.stringify(S))}function filt(x){const qv=q.value.toLowerCase();return(!qv||[x.model,x.name,x.actionType].join(' ').toLowerCase().includes(qv))&&(!eff.value||x.estimatedEffort===eff.value)}function ticket(x){const p=S[x.model]||{};return `<article class="ticket" onclick="openWO('${e(x.model)}')"><b>${e(x.model)}</b> <span class="${e(x.estimatedEffort)}">[${e(x.estimatedEffort)}]</span><br><span>${e(x.name)}</span><br><small class="muted">${e(x.actionType)} · ${p.done?'UKOŃCZONE':'DO ZROBIENIA'}</small></article>`}function render(){const a=W.items.filter(filt);fast.innerHTML=a.filter(x=>x.estimatedEffort==='S'&&x.status!=='ARCHIVE_ONLY').map(ticket).join('');rebuild.innerHTML=a.filter(x=>['M','L'].includes(x.estimatedEffort)&&x.status==='REBUILD').map(ticket).join('');manual.innerHTML=a.filter(x=>x.status==='MANUAL_REQUIRED'||x.status==='ARCHIVE_ONLY').map(ticket).join('')}window.openWO=m=>{const x=W.items.find(v=>v.model===m),p=S[m]||{};detail.innerHTML=`<h2>${e(x.model)} - ${e(x.name)}</h2><p><b>${e(x.actionType)}</b> · priorytet ${x.priorityScore} · nakład ${e(x.estimatedEffort)}</p><p>${e(x.notes)}</p><h3>Checklist</h3>${x.checklist.map((c,i)=>`<label class="check"><input type="checkbox" ${p.checks?.[i]?'checked':''} onchange="mark('${e(m)}',${i},this.checked)"> ${e(c)}</label>`).join('')}<h3>Kryteria odbioru</h3><ul>${x.acceptanceCriteria.map(c=>`<li>${e(c)}</li>`).join('')}</ul><label>Notatki<textarea oninput="note('${e(m)}',this.value)">${e(p.note||'')}</textarea></label><p><label><input type="checkbox" ${p.done?'checked':''} onchange="done('${e(m)}',this.checked)"> Oznacz lokalnie jako ukończone</label></p>${x.sourceUrl?`<a class="btn" target="_blank" href="${e(x.sourceUrl)}">Otwórz źródło</a>`:''}<button onclick="printWO('${e(m)}')">Drukuj kartę</button>`;dlg.showModal()};window.mark=(m,i,v)=>{S[m]??={};S[m].checks??=[];S[m].checks[i]=v;save()};window.note=(m,v)=>{S[m]??={};S[m].note=v;save()};window.done=(m,v)=>{S[m]??={};S[m].done=v;save();render()};window.printWO=m=>{const x=W.items.find(v=>v.model===m);const w=open('','_blank');w.document.write(`<meta charset="utf-8"><style>body{font-family:Arial;margin:30px}li{margin:8px}</style><h1>${e(x.model)} - ${e(x.name)}</h1><h2>${e(x.actionType)}</h2><ol>${x.checklist.map(c=>`<li>□ ${e(c)}</li>`).join('')}</ol><h3>Kryteria odbioru</h3><ul>${x.acceptanceCriteria.map(c=>`<li>${e(c)}</li>`).join('')}</ul>`);w.document.close();w.print()};fetch('data/rebuild-work-orders-v110.json?v='+Date.now()).then(r=>r.json()).then(x=>{W=x;render()});q.oninput=render;eff.onchange=render;exportProgress.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({generatedAt:new Date().toISOString(),progress:S},null,2)],{type:'application/json'}));a.download='pgw-v110-progress.json';a.click()};</script></main></body></html>
