<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PGW — rozpoznawanie marek</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17202a;background:#f5f7fb}body{margin:0}.wrap{max-width:1180px;margin:0 auto;padding:24px}.top{display:flex;gap:16px;justify-content:space-between;align-items:flex-start}.card{background:white;border:1px solid #dfe5ef;border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(10,20,40,.06)}h1{margin:0 0 8px}.muted{color:#667085}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{padding:10px 14px;border-radius:14px;background:#f1f5f9}.toolbar{display:grid;grid-template-columns:1fr 180px 180px;gap:10px;margin:16px 0}input,select,button,textarea{font:inherit;border:1px solid #cfd7e6;border-radius:12px;padding:10px 12px;background:white}button{cursor:pointer;background:#c00000;color:white;border-color:#c00000;font-weight:700}.ghost{background:white;color:#17202a;border-color:#cfd7e6}.table{width:100%;border-collapse:separate;border-spacing:0 8px}.table th{text-align:left;font-size:12px;color:#667085;padding:0 8px}.table td{background:white;border-top:1px solid #e5eaf2;border-bottom:1px solid #e5eaf2;padding:8px}.table td:first-child{border-left:1px solid #e5eaf2;border-radius:12px 0 0 12px}.table td:last-child{border-right:1px solid #e5eaf2;border-radius:0 12px 12px 0}.model{font-weight:800}.pill{display:inline-flex;border-radius:999px;padding:4px 8px;background:#eef2ff;color:#3538cd;font-size:12px}.suggest{font-size:12px;color:#475467}.out{width:100%;min-height:160px;margin-top:12px;font-family:ui-monospace,Menlo,monospace}.dark{background:#0f172a;color:#e5e7eb}.dark .card,.dark .table td,.dark input,.dark select,.dark textarea{background:#111827;color:#e5e7eb;border-color:#334155}.dark .stat{background:#1f2937}.dark .muted,.dark .suggest,.dark .table th{color:#aab3c5}.dark .ghost{background:#111827;color:#e5e7eb}
</style></head><body><div class="wrap">
<div class="top"><div><h1>PGW — rozpoznawanie marek</h1><p class="muted">Wewnętrzny ekran do ogarniania modeli z manifestu Drive oznaczonych jako <b>DO ROZPOZNANIA</b>.</p></div><button class="ghost" id="theme">Tryb ciemny</button></div>
<div class="card"><div class="stats" id="stats"></div><div class="toolbar"><input id="q" placeholder="Szukaj modelu, pliku, zakresu…"><select id="bucket"><option value="">Wszystkie zakresy</option></select><select id="brand"><option value="">Sugestia: wszystkie</option></select></div><div class="muted" id="meta">Ładowanie…</div></div>
<table class="table"><thead><tr><th>Model</th><th>Plik</th><th>Zakres</th><th>Sugestia</th><th>Potwierdź</th><th>PDF</th></tr></thead><tbody id="rows"></tbody></table>
<div class="card"><h2>Eksport nadpisań marek</h2><p class="muted">Wybierz marki w tabeli, kliknij eksport i wklej wynik do <code>data/brand-resolution-overrides.json</code>.</p><button id="export">Generuj JSON</button> <button class="ghost" id="copy">Kopiuj</button><textarea class="out" id="out" spellcheck="false"></textarea></div>
</div><script>
const BRANDS=['YATO','YATO GASTRO','STHOR','VOREL','FLO','LUND','FALA','VOREL','INNE'];
let DATA=[], chosen=JSON.parse(localStorage.getItem('pgw-brand-review')||'{}');
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
async function init(){try{const res=await fetch('data/brand-review-unknown.json',{cache:'no-store'});const json=await res.json();DATA=json.items||[];renderFilters(json);render();}catch(e){$('meta').textContent='Błąd ładowania: '+e.message;}}
function renderFilters(json){$('stats').innerHTML=`<span class="stat"><b>${json.count}</b> do rozpoznania</span>`+Object.entries(json.buckets||{}).map(([k,v])=>`<span class="stat">${esc(k)}: <b>${v}</b></span>`).join('');Object.keys(json.buckets||{}).sort().forEach(b=>$('bucket').insertAdjacentHTML('beforeend',`<option>${esc(b)}</option>`));['LUND','STHOR','FLO','VOREL','YATO?','STHOR/LUND/FLO/VOREL?',''].forEach(b=>{if(b)$('brand').insertAdjacentHTML('beforeend',`<option>${esc(b)}</option>`)});}
function filtered(){const q=$('q').value.toLowerCase(), b=$('bucket').value, s=$('brand').value;return DATA.filter(r=>(!q||[r.model,r.title,r.bucket,r.suggestedBrand].join(' ').toLowerCase().includes(q))&&(!b||r.bucket===b)&&(!s||String(r.suggestedBrand||'').includes(s)));}
function render(){const rows=filtered();$('meta').textContent=`Widoczne: ${rows.length} / ${DATA.length}`;$('rows').innerHTML=rows.slice(0,300).map(r=>`<tr><td><span class="model">${esc(r.model)}</span><br><span class="pill">${esc(r.currentBrand)}</span></td><td>${esc(r.title)}</td><td>${esc(r.bucket)}</td><td><b>${esc(r.suggestedBrand||'—')}</b><div class="suggest">${esc(r.suggestionReason||'Brak sugestii — sprawdź PDF/źródło.')}</div></td><td><select data-model="${esc(r.model)}"><option value="">— wybierz —</option>${BRANDS.map(b=>`<option ${chosen[r.model]===b?'selected':''}>${b}</option>`).join('')}</select></td><td><a href="${esc(r.previewUrl||r.viewerUrl)}" target="_blank">Otwórz PDF</a></td></tr>`).join('');document.querySelectorAll('select[data-model]').forEach(s=>s.onchange=()=>{if(s.value)chosen[s.dataset.model]=s.value;else delete chosen[s.dataset.model];localStorage.setItem('pgw-brand-review',JSON.stringify(chosen));});}
function exportJson(){const out={version:'manual-brand-overrides',updatedAt:new Date().toISOString(),models:chosen};$('out').value=JSON.stringify(out,null,2);}['q','bucket','brand'].forEach(id=>$(id).addEventListener('input',render));$('export').onclick=exportJson;$('copy').onclick=()=>navigator.clipboard.writeText($('out').value||'');$('theme').onclick=()=>document.body.classList.toggle('dark');init();
</script></body></html>
