<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TOYA24 Gap Register v110</title><style>:root{color-scheme:dark}body{margin:0;background:#090e16;color:#f5f7fb;font-family:system-ui}main{max-width:1400px;margin:auto;padding:24px}.card{background:#121a28;border:1px solid #2b3850;border-radius:16px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.btn,input,select{background:#182338;color:#fff;border:1px solid #40506d;border-radius:10px;padding:9px 11px;text-decoration:none}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid #2b3850;text-align:left}th{position:sticky;top:0;background:#111827}.scroll{max-height:70vh;overflow:auto}.muted{color:#9daabc}.yes{color:#54d68a}.no{color:#ff6c72}</style></head><body><main><h1>TOYA24 Gap Register v110</h1><p class="muted">Brak wyniku publicznego wyszukiwania nie oznacza braku produktu. Rejestr pokazuje stan dowodów i naszych materiałów.</p><p><a class="btn" href="quality-center.html">Quality Center</a> <a class="btn" href="rebuild-studio.html">Rebuild Studio</a></p><div id="sum" class="grid"></div><section class="card"><input id="q" placeholder="model lub nazwa"><select id="state"><option value="">Wszystkie stany</option></select></section><section class="card scroll"><table><thead><tr><th>Model</th><th>Stan</th><th>Nasze dane</th><th>TOYA24</th><th>Następne działanie</th></tr></thead><tbody id="rows"></tbody></table></section><script>let D;const e=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function render(){const v=q.value.toLowerCase(),s=state.value;const a=D.items.filter(x=>(!v||[x.model,x.name,x.state].join(' ').toLowerCase().includes(v))&&(!s||x.state===s));rows.innerHTML=a.map(x=>`<tr><td><b>${e(x.model)}</b><br><span class="muted">${e(x.name)}</span></td><td>${e(x.state)}</td><td>zdjęcie: <span class="${x.hasPhoto?'yes':'no'}">${x.hasPhoto?'TAK':'NIE'}</span><br>rysunek: <span class="${x.hasDrawing?'yes':'no'}">${x.hasDrawing?'TAK':'NIE'}</span><br>części: <span class="${x.hasParts?'yes':'no'}">${x.hasParts?'TAK':'NIE'}</span></td><td>${e(x.toya24State)}</td><td>${e(x.nextAction||'')}</td></tr>`).join('')}fetch('data/toya24-gap-register-v110.json?v='+Date.now()).then(r=>r.json()).then(x=>{D=x;sum.innerHTML=Object.entries(x.summary).map(([k,v])=>`<div class="card"><span class="muted">${e(k)}</span><br><b style="font-size:28px">${v}</b></div>`).join('');Object.keys(x.summary).forEach(k=>state.insertAdjacentHTML('beforeend',`<option>${e(k)}</option>`));render()});q.oninput=render;state.onchange=render;</script></main></body></html>
